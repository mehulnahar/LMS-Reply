# ===========================================================================
#  LMS Reply — CI/CD Pipeline
# ===========================================================================
#  Triggers:
#    • Push to main         → Lint + Test → Railway auto-deploys after CI passes
#    • Pull request to main → Lint + Test (no deploy)
#
#  Pipeline stages:
#    1. Lint   — run ESLint to catch code issues
#    2. Test   — run Jest test suite with Postgres
#    3. Deploy — Railway auto-deploys when CI passes (via "Wait for CI")
#
#  How it works:
#    Railway is connected to the GitHub repo with "Wait for CI" enabled.
#    When all GitHub Actions checks pass, Railway triggers a deploy.
#    No manual deploy step needed — Railway handles it automatically.
# ===========================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # =========================================================================
  #  Stage 1 — Lint
  # =========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # =========================================================================
  #  Stage 2 — Test
  # =========================================================================
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: lms_reply_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U testuser"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://testuser:testpass@localhost:5432/lms_reply_test
      NODE_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
